name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --no-banner --redact

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      - run: pnpm build
      - run: docker build -t docsearch-api .

  eval:
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: rag-doc-search

      # Ingestion reads Project 0's component source as plain text/AST (ts-morph, syntax only) —
      # it never builds or imports @ds/components, so checking out the source is enough; unlike
      # Project 1, there's no `pnpm build` step needed here.
      - name: Checkout design system (ingestion source)
        uses: actions/checkout@v4
        with:
          repository: Darth-koder007/00-design-system
          path: 00-design-system

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rag-doc-search/pnpm-lock.yaml

      - name: Pull the embedding + generation models
        run: |
          curl -s http://localhost:11434/api/pull -d '{"model":"nomic-embed-text"}'
          curl -s http://localhost:11434/api/pull -d '{"model":"llama3.2:3b"}'

      - name: Run the eval regression gate against Ollama
        working-directory: rag-doc-search
        env:
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          pnpm install --frozen-lockfile
          pnpm eval:check
